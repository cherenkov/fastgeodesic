[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "fastgeodesic"
version = "0.0.1"
description = "Drop-in Rust replacement for geographiclib and geopy distance: same results, 18-32x faster"
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
keywords = ["geodesic", "geographiclib", "geopy", "distance", "wgs84", "gps", "rust"]

[project.optional-dependencies]
# fastgeodesic.distance subclasses geopy.distance.geodesic; tested with geopy 2.0 to 2.5
geopy = ["geopy>=2.0,<3"]
test = [
    "pytest",
    "geographiclib",
    "geopy>=2.0,<3",
    # numpy has no prebuilt wheels on armv7, s390x and ppc64le; its test is skipped there
    'numpy; platform_machine == "x86_64" or platform_machine == "AMD64" or platform_machine == "arm64" or platform_machine == "aarch64"',
]

[tool.maturin]
python-source = "python"
module-name = "fastgeodesic._core"
features = ["pyo3/extension-module"]
